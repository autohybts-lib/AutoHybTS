# Read the Docs: Portuguese translation (project language "Portuguese (Brazil)",
# linked as a translation of the English main project, which uses the root
# .readthedocs.yaml). Set this file in the project's "Build configuration file".
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: documentation/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
