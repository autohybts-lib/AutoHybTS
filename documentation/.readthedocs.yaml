# Read the Docs: Portuguese documentation. Set the project's language to
# "Portuguese (Brazil)" and its "Build configuration file" to
# documentation/.readthedocs.yaml. Paths below are relative to the repository root.
# Dashboard setup and translation linking: documentation/contributing.rst.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: documentation/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
