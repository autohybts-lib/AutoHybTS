# Register a Trusted Publisher for release.yml and environment pypi.
# Both RC and stable tags publish to PyPI after validation and environment approval.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag
        id: check
        run: python tools/check_release.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release-checks: true

  build:
    needs: [version, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check distribution names and versions
        run: python tools/check_release.py --tag "$GITHUB_REF_NAME" --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
