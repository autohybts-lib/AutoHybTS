name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release-checks:
        description: Execute slow tutorials and network checks without publishing
        type: boolean
        default: true
  workflow_call:
    inputs:
      release-checks:
        description: Execute slow tutorials and network checks before publication
        type: boolean
        default: false

# Read-only token: CI never pushes, comments or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,stats]"
      - run: pytest -m "not slow" --cov --cov-report=term-missing

  frameworks:
    # PyTorch and TensorFlow/Keras wrappers (autohybts.models): the framework tests skip
    # locally without the libraries; here a missing framework fails instead of skipping.
    runs-on: ubuntu-latest
    env:
      AUTOHYBTS_REQUIRE_FRAMEWORKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,torch,tensorflow]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import torch, tensorflow, keras; print(torch.__version__, tensorflow.__version__, keras.__version__)"
      - run: pytest tests/leakage/test_external_frameworks.py tests/unit/test_external_models.py -rs

  minimum-versions:
    # Keeps the dependency floors in pyproject.toml honest (pandas date handling differs by major).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy==1.26.*" "pandas==2.1.*" "scikit-learn==1.4.*" "statsmodels==0.14.*" pytest hypothesis
      - run: python -m pip install --no-deps -e .
      - run: pytest -m "not slow"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      # Clean install without extras: the core must import and work on its own (T20).
      - name: Smoke test of the wheel without extras
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import autohybts, autohybts.exceptions, autohybts.domain.identity; print(autohybts.__version__)"
          # Model wrappers import without torch/tensorflow; a version check without the
          # optional 'packaging' explains how to install it (ADR-0006).
          /tmp/clean/bin/python -c "import autohybts.models as m; from autohybts.exceptions import UnsupportedCapabilityError as E
          try:
              m.require({'numpy': '>=1'})
          except E as e:
              assert 'packaging' in str(e), e
          else:
              import importlib.util; assert importlib.util.find_spec('packaging'), 'expected an error'"
      - name: Exercise the installed wheel
        run: /tmp/clean/bin/python tools/smoke_wheel.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs,stats]"
      - run: sphinx-build -W --keep-going documentation documentation/_build/html
      - run: sphinx-build -W --keep-going documentation/en documentation/_build/html-en

  nixtla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,stats,nixtla-stats]"
      - run: python -c "import statsforecast; print(statsforecast.__version__)"
      - run: pytest tests/unit/test_statsforecast.py tests/regression/test_legacy_parity.py tests/contracts/test_base_forecaster.py tests/leakage/test_base_causality.py -q

  release-checks:
    if: ${{ inputs.release-checks == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [pt, en]
    env:
      AUTOHYBTS_RUN_HEAVY: "1"
      AUTOHYBTS_REQUIRE_FRAMEWORKS: "1"
      AUTOHYBTS_REQUIRE_NOTEBOOKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,stats,notebook,optuna,boosting,datasets,nixtla-stats,torch,tensorflow]"
      - name: Run slow tests and Portuguese tutorials
        if: matrix.language == 'pt'
        run: pytest -m slow --run-network -k "not en/" -q
      - name: Run English tutorials
        if: matrix.language == 'en'
        run: pytest tests/integration/test_notebooks.py -m slow --run-network -k "en/" -q
      - name: Check dataset downloads
        if: matrix.language == 'pt'
        run: pytest -m network --run-network -k "not notebook" -q

  audit:
    # Known vulnerabilities in core and the selected forecasting extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip install -e ".[stats,plot,optuna,datasets]"
      - run: pip-audit --skip-editable
