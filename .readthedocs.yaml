# Read the Docs: main project (English), builds documentation/en with Sphinx.
# The Portuguese translation is a second Read the Docs project whose
# "Build configuration file" setting points to documentation/.readthedocs.yaml.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: documentation/en/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
