# Read the Docs: English documentation. Set the project's language to "English"
# and its "Build configuration file" to .readthedocs.yaml.
# For /pt-br/latest/, use documentation/.readthedocs.yaml instead.
# Dashboard setup and translation linking: documentation/contributing.rst.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: documentation/en/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
