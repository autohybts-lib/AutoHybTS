[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autohybts"
dynamic = ["version"]
description = "Automated Hybrid Time Series Forecasting: guarded search and incremental selection of standalone and hybrid forecasters."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AutoHybTS contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
stats = ["statsmodels>=0.14"]
plot = ["matplotlib>=3.10"]
yaml = ["pyyaml>=6.0"]
optuna = ["optuna>=3.5"]
# Reading the M3 benchmark (R data file of the Mcomp package).
datasets = ["rdata>=0.11"]
# Building documentation/ with Sphinx.
docs = ["sphinx>=7.3", "furo>=2024.5.6", "myst-nb>=1.1", "sphinx-copybutton>=0.5"]
# Running examples/*.ipynb in an editor (ipykernel) and in tests (nbclient).
notebook = ["ipykernel>=6.29", "matplotlib>=3.10", "nbclient>=0.10", "nbformat>=5.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "build>=1.2",
]

[tool.hatch.version]
path = "src/autohybts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autohybts"]

[tool.hatch.build.targets.sdist]
include = ["src/autohybts", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Agent skills and the (untracked) docs are not package code.
extend-exclude = [".agents", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "NPY"]
# pt-BR user-facing text legitimately uses characters these rules flag.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Explicit, so submodules that do not exist yet (examples use the target API) still sort as ours.
known-first-party = ["autohybts"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/autohybts"]
warn_unreachable = true

[[tool.mypy.overrides]]
# No type information shipped by these libraries (matplotlib/plot, optuna and
# rdata/datasets: optional extras, may be absent).
module = ["statsmodels.*", "sklearn.*", "scipy.*", "matplotlib.*", "optuna", "optuna.*", "rdata", "rdata.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "unit: isolated unit tests (tests/unit)",
    "integration: end-to-end pipelines (tests/integration)",
    "contracts: public contracts and protocols (tests/contracts)",
    "leakage: temporal causality and sealed-test checks (tests/leakage)",
    "regression: parity with fixtures, including legacy behaviour (tests/regression)",
    "slow: excluded from the per-PR CI run",
    "network: needs internet; skipped unless --run-network is given",
]

[tool.coverage.run]
source = ["autohybts"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
