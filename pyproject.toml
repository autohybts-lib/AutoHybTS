[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autohybts"
dynamic = ["version"]
description = "Automated Hybrid Time Series Forecasting: guarded search and incremental selection of standalone and hybrid forecasters."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "João Ataíde" }]
keywords = ["time series", "forecasting", "hybrid models", "residual correction", "automl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/autohybts-lib/AutoHybTS"
Documentation = "https://autohybts.readthedocs.io/"
Source = "https://github.com/autohybts-lib/AutoHybTS"
Issues = "https://github.com/autohybts-lib/AutoHybTS/issues"

[project.optional-dependencies]
stats = ["statsmodels>=0.14"]
plot = ["matplotlib>=3.10"]
yaml = ["pyyaml>=6.0"]
optuna = ["optuna>=3.5"]
# User models built with PyTorch or TensorFlow/Keras (autohybts.models); packaging checks
# the PEP 440 version requirements of registered models (ADR-0006).
torch = ["torch>=2.2", "packaging>=22"]
tensorflow = ["tensorflow>=2.16", "packaging>=22"]
# Gradient boosting on lags (LightGBM, XGBoost, CatBoost); scikit-learn's
# HistGradientBoosting and AdaBoost.R2 need no extra.
boosting = ["lightgbm>=4", "xgboost>=2", "catboost>=1.2"]
# Nixtla StatsForecast (AutoARIMA, AutoETS, AutoTheta, AutoCES). Its releases require
# pandas<3, so this extra brings pandas 2.x.
nixtla-stats = ["statsforecast>=2"]
# Reading the M3 benchmark (R data file of the Mcomp package).
datasets = ["rdata>=0.11"]
# Building documentation/ with Sphinx.
docs = ["sphinx>=7.3", "furo>=2024.5.6", "myst-nb>=1.1", "sphinx-copybutton>=0.5"]
# Progress bars of the experiment steps (progress=True).
progress = ["tqdm>=4.66"]
# Running examples/*.ipynb in an editor (ipykernel) and in tests (nbclient).
notebook = [
    "ipykernel>=6.29",
    "matplotlib>=3.10",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "build>=1.2",
    "packaging>=22",
]

[tool.hatch.version]
path = "src/autohybts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autohybts"]
# 2.4 is enough for License-Expression; newer hatchling defaults to 2.5 (PEP 794).
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src/autohybts", "tests", "tools", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Agent skills and the (untracked) docs are not package code.
extend-exclude = [".agents", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "NPY"]
# pt-BR user-facing text legitimately uses characters these rules flag.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# Explicit, so submodules that do not exist yet (examples use the target API) still sort as ours.
known-first-party = ["autohybts"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/autohybts"]
warn_unreachable = true

[[tool.mypy.overrides]]
# No type information shipped by these libraries (matplotlib/plot, optuna,
# rdata/datasets, keras/tensorflow and torch: optional extras, may be absent).
module = ["statsmodels.*", "sklearn.*", "threadpoolctl", "lightgbm", "lightgbm.*", "xgboost", "xgboost.*", "catboost", "catboost.*", "scipy.*", "matplotlib.*", "optuna", "optuna.*", "rdata", "rdata.*", "keras", "keras.*", "tensorflow", "tensorflow.*", "torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The example architectures subclass nn.Module, which is Any when torch (optional
# extra) is not installed; subclassing Any is fine here.
module = ["autohybts.models.torch_zoo"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "unit: isolated unit tests (tests/unit)",
    "integration: end-to-end pipelines (tests/integration)",
    "contracts: public contracts and protocols (tests/contracts)",
    "leakage: temporal causality and sealed-test checks (tests/leakage)",
    "regression: parity with fixtures, including legacy behaviour (tests/regression)",
    "slow: excluded from the per-PR CI run",
    "network: needs internet; skipped unless --run-network is given",
]

[tool.coverage.run]
source = ["autohybts"]
branch = true
omit = [
    # Wrappers of optional frameworks (extras torch/tensorflow) are only
    # exercised when those extras are installed (locally and in notebook 10);
    # the CI coverage gate must not depend on them.
    "*/models/torch_models.py",
    "*/models/torch_zoo.py",
    "*/models/keras_models.py",
    "*/models/keras_zoo.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
