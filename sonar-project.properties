sonar.projectKey=autohybts
sonar.projectName=AutoHybTS
sonar.projectVersion=1.0.0rc5
sonar.sourceEncoding=UTF-8

sonar.sources=src/autohybts
sonar.tests=tests

sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

# Mirrors [tool.coverage.run] omit in pyproject.toml: optional framework
# wrappers (torch/tensorflow extras) are not exercised by the CI gate.
sonar.coverage.exclusions=\
  src/autohybts/models/torch_models.py,\
  src/autohybts/models/torch_zoo.py,\
  src/autohybts/models/keras_models.py,\
  src/autohybts/models/keras_zoo.py

# Generated assets, caches and notebooks are not analysed.
sonar.exclusions=\
  notebooks/**,\
  documentation/**,\
  benchmarks/**,\
  tools/**,\
  dist/**,\
  **/__pycache__/**,\
  **/*.pyc
